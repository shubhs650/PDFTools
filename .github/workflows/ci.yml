name: CI

# When CI runs:
# - Pull requests: the checks job, plus the @smoke e2e flows with the @smoke perf
#   scenarios in one job and the offline and accessibility gates in another, side
#   by side. A PR whose files are all Markdown or under docs/ skips e2e. Add the
#   `full-e2e` label to a PR to run the full suite on it instead (removing it runs
#   the smoke set again).
# - Push to main, nightly, and Run workflow (workflow_dispatch): the checks job,
#   the full e2e suite in 3 shards, the accessibility gate, and the offline flow,
#   perf gate and acceptance table, each set in its own job.
# - "CI result" always runs last and fails if any job above failed or was
#   cancelled: one check to read before merging.
# The offline flow and the accessibility gate run as their own Playwright runs,
# as they did before sharding: mixing the CPU-heavy axe scans into the shards
# coincided with timing failures in other flows.
# A branch push runs CI only through its PR: with both `push: ['**']` and
# `pull_request`, every PR commit ran CI twice, in two concurrency groups
# (refs/heads/<branch> and refs/pull/<n>/merge).
#
# Two PRs at once (M12 autodrive): each PR has its own concurrency group, so a new
# commit cancels only that PR's older run; runs on main are never cancelled and
# queue one at a time. A PR run tests the PR merged onto main as it was when the
# run started: when another PR merges first, update the branch from main and wait
# for a green run before merging (docs/deploy/ci.md).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck · Lint · Unit tests · Licenses · Build · Bundle budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install qpdf (the save matrix checks every saved file; not a dependency)
        run: sudo apt-get install -y qpdf
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # Typed linting of the whole tree needs more than Node's default heap on the
        # runner (about 2 GB): it ran out of memory there from 2026-11-19.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit tests
        run: npm run test
      - name: License gate (D-12)
        run: npm run licenses
      - name: Build
        run: npm run build
      - name: No test hook or other forbidden strings in the build (M1-02)
        run: npm run check:dist
      - name: Cloudflare Pages limits and root files (D-11)
        run: npm run check:pages
      - name: Bundle report and install budget (M1-27, §9)
        run: |
          mkdir -p reports
          npm run bundle-report -- --json reports/bundle.json --markdown reports/bundle.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: reports/
          retention-days: 30

  changes:
    name: Which e2e suite to run
    runs-on: ubuntu-24.04
    outputs:
      suite: ${{ steps.pick.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: full (main, nightly, manual, `full-e2e` label) · none (docs-only PR) · smoke (other PRs)
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$FULL_LABEL" = "true" ]; then
            suite=full
          else
            # HEAD is the PR merge commit; its first parent is the base branch.
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "$changed"
            if echo "$changed" | grep -vE '(^docs/|\.md$)' | grep -q .; then suite=smoke; else suite=none; fi
          fi
          echo "suite=$suite" | tee -a "$GITHUB_OUTPUT"

  e2e-smoke:
    name: E2E smoke · Perf smoke (Playwright, Chromium)
    needs: changes
    if: needs.changes.outputs.suite == 'smoke'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e
      - name: Smoke flows (built app under the production _headers)
        run: npm run e2e -- --grep @smoke --grep-invert "@offline|@a11y"
      - name: Perf gate, @smoke scenarios (no main-thread task > 100 ms after boot)
        if: success() || failure()
        run: npm run perf -- --grep @smoke
        env:
          E2E_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  e2e-smoke-gates:
    # Its own runner, beside the smoke flows: in one job the four runs took about
    # 13 min one after another (smoke 6 min, offline 1.5 min, axe 5.5 min).
    name: Offline · Accessibility (Playwright, Chromium)
    needs: changes
    if: needs.changes.outputs.suite == 'smoke'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e
      - name: Offline and update flow (§9, D-17, D-18)
        run: npm run e2e:offline
      - name: Accessibility gate (axe, rule 12)
        if: success() || failure()
        run: npm run e2e:a11y
        env:
          E2E_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke-gates
          path: playwright-report/
          retention-days: 7

  e2e:
    name: E2E (full suite, shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e
      - name: E2E tests (built app under the production _headers)
        run: npm run e2e -- --grep-invert "@offline|@a11y" --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  a11y:
    name: Accessibility gate (axe, rule 12)
    needs: changes
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e
      - name: Accessibility gate (axe, rule 12)
        run: npm run e2e:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7

  gates:
    name: Offline · Perf · Acceptance (Playwright, Chromium)
    needs: changes
    if: needs.changes.outputs.suite == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e
      - name: Offline and update flow (§9, D-17, D-18)
        # Its own output folder: the perf run below starts by clearing test-results/, which
        # took the offline traces with it.
        run: npm run e2e:offline -- --reporter=github,json --output=offline-results
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/offline.json
      - name: Perf gate (no main-thread task > 100 ms after boot)
        if: success() || failure()
        run: npm run perf -- --reporter=github,json
        env:
          E2E_SKIP_BUILD: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/perf.json
      - name: Perf report (numbers are report-only, ADR-002)
        if: always()
        run: npm run perf-report -- reports/perf.json --json reports/perf-rows.json
      - name: M1 … M4 acceptance table (§12 targets on typical files, M1-28, M2-19, M3-20, M4-22)
        if: always()
        run: npm run acceptance -- reports/perf.json reports/offline.json --json reports/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: reports/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-gates
          path: |
            playwright-report/
            offline-results/
          retention-days: 7

  result:
    # A job skipped by the suite choice counts as passed; a failed or cancelled one does not.
    name: CI result
    needs: [checks, changes, e2e-smoke, e2e-smoke-gates, e2e, a11y, gates]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A CI job ended as $r"; exit 1 ;; esac
          done
